# Deployment server (podman rootless + docker-compose). Jalankan lewat scripts/deploy.sh.
# Rahasia ada di .env di direktori deploy server (tidak di-commit); dipakai untuk env_file dan substitusi ${...}.
x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-app: &app
  image: eticket-app:${APP_IMAGE_TAG:-latest}
  env_file: .env
  restart: always
  logging: *default-logging
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
  networks: [eticket]

services:
  web:
    <<: *app
    container_name: eticket_web
    # Tidak dipublikasikan langsung: semua akses lewat proxy HTTPS.
    environment:
      DATABASE_URL: postgres://eticket:${POSTGRES_PASSWORD}@eticket_postgres:5432/eticket
      REDIS_URL: redis://eticket_redis:6379
    volumes: [uploads:/app/storage/uploads]
    mem_limit: 1024m
    cpus: 2

  worker:
    <<: *app
    container_name: eticket_worker
    command: ["node", "--import", "tsx", "scripts/worker.ts"]
    environment:
      DATABASE_URL: postgres://eticket:${POSTGRES_PASSWORD}@eticket_postgres:5432/eticket
      REDIS_URL: redis://eticket_redis:6379
    volumes: [uploads:/app/storage/uploads]
    mem_limit: 512m
    cpus: 0.5

  proxy:
    image: docker.io/library/caddy:2-alpine
    container_name: eticket_proxy
    restart: always
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-172.20.240.61}
      HTTPS_PORT: ${HTTPS_PORT:-3443}
      HTTP_PORT: ${APP_PORT:-3110}
    # Port HTTP (APP_PORT, 3110) tidak lagi dipublikasikan: akses publik lewat domain (Cloudflare Tunnel).
    ports: ["${HTTPS_PORT:-3443}:${HTTPS_PORT:-3443}"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [web]
    logging: *default-logging
    mem_limit: 128m
    networks: [eticket]

  # Akses internet lewat Cloudflare Tunnel (koneksi keluar saja; tanpa IP publik / port terbuka).
  # Aktif bila TUNNEL_TOKEN ada di .env (deploy.sh menyalakan profile "tunnel").
  # Public hostname di dashboard Cloudflare → service HTTP eticket_web:3000.
  tunnel:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: eticket_tunnel
    profiles: [tunnel]
    restart: always
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [web]
    logging: *default-logging
    mem_limit: 128m
    networks: [eticket]

  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: eticket_postgres
    restart: always
    environment:
      POSTGRES_USER: eticket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib}
      POSTGRES_DB: eticket
      TZ: UTC
    command: ["postgres", "-c", "max_connections=200", "-c", "timezone=UTC"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eticket"]
      interval: 10s
      retries: 5
    logging: *default-logging
    mem_limit: 768m
    networks: [eticket]

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: eticket_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    logging: *default-logging
    mem_limit: 320m
    networks: [eticket]

  # Penampung email sementara sampai SMTP asli diisi di .env server.
  # UI hanya di localhost server: akses via `ssh -L 8030:127.0.0.1:3111 usersentul01@172.20.240.61`.
  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: eticket_mailpit
    restart: always
    ports: ["127.0.0.1:${MAILPIT_UI_PORT:-3111}:8025"]
    logging: *default-logging
    mem_limit: 128m
    networks: [eticket]

volumes:
  caddydata:
  caddyconfig:
  pgdata:
  redisdata:
  uploads:

networks:
  eticket:
    name: eticket_network
